[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostlm"
version = "0.9.34"
description = "Open-source language model built from scratch in PyTorch. Purpose-built for cybersecurity, with code, general language, and math reasoning folded into the v1.0 corpus."
readme = "README.md"
license = "MIT"
authors = [{name = "Joe Munene"}]
requires-python = ">=3.10"
keywords = ["machine-learning", "cybersecurity", "transformer", "pytorch", "language-model", "nlp", "from-scratch", "pretraining", "rope", "cybersec-llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "transformers>=4.36.0",
    "tiktoken>=0.5.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
train = ["wandb>=0.16.0", "matplotlib>=3.8.0"]
export = ["safetensors>=0.4.0"]
data = [
    "datasets>=2.16.0",
    "tokenizers>=0.15.0",
    "requests>=2.31.0",
    "pymupdf>=1.24.0",  # arXiv full-text PDF extraction
]
serve = ["fastapi>=0.110.0", "uvicorn>=0.29.0", "pydantic>=2.0.0"]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[project.urls]
Homepage = "https://github.com/joemunene-by/GhostLM"
Repository = "https://github.com/joemunene-by/GhostLM"
Issues = "https://github.com/joemunene-by/GhostLM/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["ghostlm*"]

[tool.ruff]
line-length = 110
target-version = "py310"
# Lint the shipped packages and their tests. scripts/ is a large pile of
# one-off operational tooling; lint it opportunistically, not as a gate.
include = ["ghostlm/**/*.py", "ghostbench/**/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Tests prepend the repo root to sys.path before importing the package.
"tests/**" = ["E402"]
"ghostbench/tests/**" = ["E402"]
